<!DOCTYPE html>                                          //告诉浏览器这是html5
<html>                                                   //外壳
<head>                                                   //存放设置，里面的东西不显示在页面上
  <meta charset="UTF-8">                                 //声明编码
  <title>第一个程序</title>                               //浏览器标签页显示的字
</head>                                                  //存放设置，里面的东西不显示在页面上
<body>                                                   //用户能看到的东西
  <h1>我的第一个网页</h1>                                 //一级标题，页面上的字
  <script>                                               //里面写Javascript
    let name = prompt("你叫什么名字？");
    alert("你好，" + name + "！");
    console.log("程序跑通了");
  </script>                                              //里面写Javascript
</body>                                                  //用户能看到的东西 
</html>                                                  //外壳
