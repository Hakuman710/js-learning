<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法表</title>
</head>
<body>
    <h1>九九乘法表</h1>
    <script>
        for (let i = 1;i <= 9;i++){
            let row = "";
            for (let j = 1;j <= i;j++){
                row += j + "×" + i + "=" + j*i + "  ";
            }
            console.log(row);
        }  
    </script>
</body>
</html>
